<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e3324"/>
      <stop offset="0.6" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#0d0a06"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3d8a0"/>
      <stop offset="0.5" stop-color="#fff5d0"/>
      <stop offset="1" stop-color="#a3d8a0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#3aa86a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3aa86a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bgPattern" patternUnits="userSpaceOnUse" width="22" height="22" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#a3d8a0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="240" height="300" rx="12" fill="url(#bg)"/>
  <rect width="240" height="300" rx="12" fill="url(#bgPattern)"/>

  <!-- 光晕 -->
  <ellipse cx="120" cy="80" rx="100" ry="72" fill="url(#glow)"/>


  <!-- 武将剪影 -->
  <g transform="translate(120,92)">
    <!-- 披风 -->
    <path d="M0,-4 C-46,2 -72,22 -82,58 L-56,60 C-48,34 -28,20 0,14 Z" fill="#3aa86a" opacity="0.45"/>
    <path d="M0,-4 C46,2 72,22 82,58 L56,60 C48,34 28,20 0,14 Z" fill="#3aa86a" opacity="0.45"/>
    <!-- 长袍身躯 -->
    <path d="M-30,12 L30,12 L40,78 L-40,78 Z" fill="#0e3324" stroke="#3aa86a" stroke-width="2.5"/>
    <!-- 腰带 -->
    <rect x="-32" y="48" width="64" height="8" rx="4" fill="#a3d8a0"/>
    <!-- 肩甲 -->
    <path d="M-30,12 L-45,22 L-35,30 Z" fill="#a3d8a0" opacity="0.85"/>
    <path d="M30,12 L45,22 L35,30 Z" fill="#a3d8a0" opacity="0.85"/>
    <!-- 头部 -->
    <circle cx="0" cy="-20" r="16" fill="#0e3324" stroke="#3aa86a" stroke-width="2.5"/>
    <circle cx="0" cy="-20" r="6" fill="#3aa86a" opacity="0.25"/>
    <!-- 头盔 -->
    <path d="M-8,-34 L0,-48 L8,-34 Z" fill="#a3d8a0"/>
    <path d="M0,-48 C-9,-55 -4,-61 0,-58 C4,-61 9,-55 0,-48" stroke="#3aa86a" stroke-width="2" fill="none"/>
    <!-- 剑 -->
    <rect x="34" y="4" width="5" height="66" rx="2.5" fill="#a3d8a0"/>
    <rect x="25" y="-2" width="23" height="7" rx="3" fill="#a3d8a0"/>
  </g>

  <!-- 武将名（书法字，缩小置于剪影下方） -->
  <text x="120" y="187.7" text-anchor="middle" font-size="42" font-family="STKaiti,KaiTi,STSong,serif" font-weight="bold" fill="#f7e8c0" style="text-shadow:0 2px 8px rgba(0,0,0,.7);letter-spacing:3px">大</text>
  <text x="120" y="223.7" text-anchor="middle" font-size="42" font-family="STKaiti,KaiTi,STSong,serif" font-weight="bold" fill="#f7e8c0" style="text-shadow:0 2px 8px rgba(0,0,0,.7);letter-spacing:3px">乔</text>

  <!-- 金色边框（双层） -->
  <rect x="5" y="5" width="230" height="290" rx="10" fill="none" stroke="url(#frame)" stroke-width="2.5"/>
  <rect x="12" y="12" width="216" height="276" rx="7" fill="none" stroke="#a3d8a0" stroke-opacity="0.35" stroke-width="1"/>

  <!-- 势力角标（左上角三角） -->
  <polygon points="12,12 52,12 12,52" fill="#3aa86a" stroke="#a3d8a0" stroke-width="1.5"/>
  <text x="26" y="40" font-size="20" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-weight="bold" fill="#f3e5a3">吴</text>

  <!-- 体力心（右上） -->
  <text x="226" y="34" font-size="18" text-anchor="end" fill="#ff5555">❤❤❤</text>

  <!-- 称号条 -->
  <rect x="25" y="244" width="190" height="34" rx="3" fill="#1a1008" stroke="#a3d8a0" stroke-opacity="0.5"/>
  <line x1="25" y1="244" x2="215" y2="244" stroke="#a3d8a0" stroke-opacity="0.7"/>
  <line x1="25" y1="278" x2="215" y2="278" stroke="#a3d8a0" stroke-opacity="0.7"/>
  <text x="120" y="268" text-anchor="middle" font-size="16"
    font-family="STKaiti,KaiTi,STSong,serif" letter-spacing="5px" fill="#a3d8a0">矜持之花</text>

  <!-- 顶部装饰角 -->
  <path d="M12 70 L12 85 L27 85 Z" fill="#a3d8a0" opacity="0.6"/>
  <path d="M228 70 L228 85 L213 85 Z" fill="#a3d8a0" opacity="0.6"/>
</svg>