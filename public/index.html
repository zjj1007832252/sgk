<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国杀 · 标准版</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ 主页 ============ -->
  <div id="view-home" class="view active">
    <div class="home-bg"></div>
    <div class="home-content">
      <h1 class="game-title">三 国 杀</h1>
      <div class="game-subtitle">— 标 准 版 · 身 份 局 —</div>
      <div class="home-panel">
        <label class="input-label">你的昵称</label>
        <input id="input-name" maxlength="12" placeholder="请输入昵称">
        <div class="home-buttons">
          <button id="btn-create" class="btn btn-primary">创建房间</button>
          <button id="btn-refresh" class="btn">刷新列表</button>
          <button id="btn-diy" class="btn">DIY 武将</button>
        </div>
      </div>
      <div class="room-list-panel">
        <div class="panel-title">房间列表 <span class="hint">（同一局域网内可见）</span></div>
        <div id="room-list" class="room-list"><div class="empty">暂无房间，创建一个吧</div></div>
      </div>
    </div>
  </div>

  <!-- ============ 房间大厅 ============ -->
  <div id="view-lobby" class="view">
    <div class="lobby-wrap">
      <div class="lobby-header">
        <span id="lobby-room-name" class="lobby-title"></span>
        <span id="lobby-state" class="lobby-state"></span>
      </div>
      <div class="lobby-main">
        <div class="lobby-left">
          <div class="panel-title">座位 <span class="hint">点击空位坐下 / 换座</span></div>
          <div id="seat-grid" class="seat-grid"></div>
          <div class="lobby-actions">
            <button id="btn-add-ai" class="btn">＋ 添加电脑</button>
            <button id="btn-start" class="btn btn-primary">开始游戏</button>
            <button id="btn-leave" class="btn btn-danger">离开房间</button>
          </div>
          <div class="panel-title" style="margin-top:14px">点身份 <span class="hint">（可选，开局优先分配）</span></div>
          <div id="identity-pick" class="identity-pick"></div>
        </div>
        <div class="lobby-right">
          <div class="panel-title">房间设置</div>
          <div id="lobby-opts" class="lobby-opts"></div>
          <div class="panel-title" style="margin-top:14px">聊天</div>
          <div id="chat-box" class="chat-box"></div>
          <div class="chat-input-row">
            <input id="chat-input" maxlength="60" placeholder="输入聊天内容…">
            <button id="btn-chat" class="btn">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 牌桌 ============ -->
  <div id="view-game" class="view">
    <div class="table">
      <div class="table-felt" id="table-felt">
        <div id="opponents"></div>
        <div class="table-center">
          <div id="center-status" class="center-status"></div>
          <div id="center-area" class="center-area"></div>
        </div>
        <div id="my-panel" class="my-panel"></div>
        <div id="my-hand" class="my-hand"></div>
        <div id="action-bar" class="action-bar"></div>
      </div>
      <div class="side-panel">
        <div id="prompt-bar" class="prompt-bar"></div>
        <div class="side-tabs">
          <span class="side-tab active">战报</span>
        </div>
        <div id="game-log" class="game-log"></div>
        <button id="btn-quit-game" class="btn btn-small">离开（AI托管）</button>
      </div>
    </div>
  </div>

  <!-- ============ DIY 武将 ============ -->
  <div id="view-diy" class="view">
    <div class="diy-wrap">
      <div class="lobby-header">
        <span class="lobby-title">DIY 武将</span>
        <button id="btn-diy-back" class="btn">返回</button>
      </div>
      <div class="diy-main">
        <div class="diy-form-panel">
          <div class="panel-title">创建武将（从技能库拼装）</div>
          <div class="diy-form">
            <label>名称 <input id="diy-name" maxlength="4" placeholder="如：赵云云"></label>
            <label>称号 <input id="diy-title" maxlength="8" placeholder="如：常山英魂"></label>
            <label>势力
              <select id="diy-kingdom">
                <option value="wei">魏</option><option value="shu">蜀</option>
                <option value="wu">吴</option><option value="qun">群</option>
              </select>
            </label>
            <label>体力
              <select id="diy-hp"><option>3</option><option selected>4</option><option>5</option></select>
            </label>
            <label>性别
              <select id="diy-gender"><option value="m">男</option><option value="f">女</option></select>
            </label>
            <div class="diy-skills-title">技能（选 1~2 个）</div>
            <div id="diy-skill-list" class="diy-skill-list"></div>
            <label>头像（可选，上传图片覆盖自动生成）
              <input id="diy-avatar" type="file" accept="image/*">
            </label>
            <button id="btn-diy-save" class="btn btn-primary">保存武将</button>
            <div id="diy-msg" class="diy-msg"></div>
          </div>
        </div>
        <div class="diy-list-panel">
          <div class="panel-title">已创建的武将</div>
          <div id="diy-list" class="diy-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal-mask" class="modal-mask hidden">
    <div id="modal" class="modal"></div>
  </div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
